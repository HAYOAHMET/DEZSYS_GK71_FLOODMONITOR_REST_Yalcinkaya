# ==========================================================
#  FloodMonitor REST - Basiskonfiguration
# ==========================================================
spring.application.name=floodmonitor-rest
server.port=8080

# ----------------------------------------------------------
#  Simulation
# ----------------------------------------------------------
# Intervall der Messwerterzeugung in Millisekunden
simulation.interval=10000
# Simulation beim Start aktivieren (in Tests deaktiviert)
simulation.enabled=true
# Anzahl der beim Start vorbefuellten historischen Messungen pro Station
simulation.seed-history=30

# ----------------------------------------------------------
#  Jackson / Content Negotiation
# ----------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ----------------------------------------------------------
#  OpenAPI / Swagger UI
# ----------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ----------------------------------------------------------
#  Actuator
# ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info
